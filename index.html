<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><meta name="description" content="KoOo Mini POS Cloud 3.0">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="css/style.css">
<title>KoOo Mini POS Cloud</title></head><body>
<div class="shell">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">K</div><div><b>KoOo POS</b><small>CLOUD · VERSION 3.0</small></div></div>
<nav id="nav"><button data-page="dashboard" class="active">▦ Dashboard</button><button data-page="pos">▣ Point of Sale</button><button data-page="products">□ Products & Stock</button><button data-page="customers">♙ Customers</button><button data-page="sales">▤ Sales History</button><button data-page="expenses">↗ Expenses</button><button data-page="team">♧ Team & Access</button><button data-page="settings">⚙ Cloud & Backup</button></nav>
<div class="sidefoot"><i></i><span id="connectionText">Not connected</span></div></aside>
<main><header><div class="heading"><button id="menu" class="mobile">☰</button><div><h1 id="title">Dashboard</h1><p id="sub">Your store at a glance</p></div></div><div class="header-right"><span id="syncBadge" class="pill">● Offline</span><button id="accountBtn" class="user">?</button></div></header>
<div id="authScreen" class="auth-wrap"><div class="auth-card"><div class="logo large">K</div><h1>KoOo Mini POS Cloud</h1><p class="muted">Sign in or create your store account</p><div class="tabs"><button id="loginTab" class="chosen">Sign in</button><button id="signupTab">Create account</button></div><form id="authForm"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"><label>Password</label><input name="password" type="password" required minlength="6" placeholder="At least 6 characters"><label id="storeLabel" class="hidden">Store name (for new account)</label><input id="storeInput" name="store" class="hidden" placeholder="My General Store"><button class="primary wide" id="authSubmit">Sign in</button></form><p id="authMessage" class="muted"></p><p class="tiny">Cloud setup required: add your Supabase URL and anon key in js/config.js.</p></div></div>
<section id="appPage" class="page hidden"></section><footer id="footer" class="hidden">KoOo Mini POS Cloud 3.0 · Your data belongs to your Supabase project</footer>
</main></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script></body></html>
